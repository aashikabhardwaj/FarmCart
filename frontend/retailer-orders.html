<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retailer Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/retailer-orders.css">

</head>

<body class="bg-light">

<div class="bg-success text-white shadow-sm py-3">

    <div class="container d-flex justify-content-between align-items-center">

        <h3 class="mb-0">
            <i class="fa-solid fa-store"></i>
            FarmCart
        </h3>

        <button
            class="btn btn-light"
            onclick="location.href='retailer-dashboard.html'">

            <i class="fa-solid fa-arrow-left"></i>
            Dashboard

        </button>

    </div>

</div>

<div class="container py-5">

    <div class="card shadow border-0">

        <div class="card-header bg-success text-white">

            <h3 class="mb-0">
                <i class="fa-solid fa-box-open"></i>
                My Orders
            </h3>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle text-center">

                    <thead class="table-success">

                        <tr>

                            <th>Customer</th>
                            <th>Product</th>
                            <th>Qty</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="ordersTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- Packaging Modal -->

<div class="modal fade" id="packagingModal" tabindex="-1">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">
Select Packaging
</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<input
type="hidden"
id="packagingOrderId">

<label class="form-label">
Packaging Type
</label>

<select
id="packagingType"
class="form-select">

<option value="">Select Packaging</option>

<option value="Paper Box">Paper Box</option>

<option value="Paper Wrap">Paper Wrap</option>

<option value="Cloth Bag">Cloth Bag</option>

<option value="Jute Bag">Jute Bag</option>

<option value="Glass Bottle">Glass Bottle</option>

<option value="Other Eco Packaging">Other Eco Packaging</option>

</select>
</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Cancel

</button>

<button
class="btn btn-success"
onclick="savePackaging()">

Save

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/retailer-orders.js"></script>

</body>
</html>
