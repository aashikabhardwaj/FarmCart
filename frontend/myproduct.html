
<!DOCTYPE html>
<html>
<head>
  <title>My Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/myproduct.css">
</head>

<body>

<!-- HEADER -->
<nav class="navbar navbar-dark bg-success px-3 d-flex justify-content-between align-items-center">

  <a class="navbar-brand" href="#">
    FarmCart
  </a>

  <a href="farmer-dashboard.html" class="btn btn-light">
    <i class="fa-solid fa-arrow-left me-2"></i>
    Dashboard
  </a>

</nav>

<!-- Banner -->
<section class="myproduct-banner">

  <div class="banner-overlay">

    <h1>My Products</h1>

    <p>
      Manage your fresh farm products, update stock and grow your business.
    </p>

    <button class="btn btn-success"
    onclick="window.location.href='add-product.html'">
      + Add Product
    </button>

  </div>

</section>

<!-- MAIN -->
<div class="container mt-4">

  <h3 class="mb-3">My Products</h3>

  <!-- SEARCH + FILTER -->
  <div class="row mb-4 search-box">

    <div class="col-md-8 mb-2">
      <input type="text" id="searchInput" class="form-control search-input" placeholder="Search products...">
    </div>

    <div class="col-md-4 mb-2">
      <select id="categoryFilter" class="form-select">
        <option value="">All Categories</option>
        <option value="Fruit">Fruit</option>
        <option value="Vegetable">Vegetable</option>
        <option value="Grain">Grain</option>
        <option value="Dairy">Dairy</option>
        <option value="Others">Others</option>
      </select>
    </div>

  </div>

  <!-- PRODUCTS -->
  <div class="row" id="myProductsGrid"></div>

</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
        <p class="mb-1">
            &copy; 2025 FarmCart. All Rights Reserved.
        </p>

        <a href="#" class="text-info mx-2">
            Privacy Policy
        </a>
        |

        <a href="#" class="text-info mx-2">
            Terms & Conditions
        </a>
    </div>
</footer>

<script src="js/myproduct.js"></script>

</body>
</html>
