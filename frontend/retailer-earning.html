<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retailer Earnings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/retailer-earning.css">

</head>

<body class="bg-light">

<div class="bg-success text-white shadow-sm py-3">

    <div class="container d-flex justify-content-between align-items-center">

        <h3 class="mb-0">
            <i class="fa-solid fa-store"></i>
            FarmCart
        </h3>

        <button
            class="btn btn-light"
            onclick="location.href='retailer-dashboard.html'">

            <i class="fa-solid fa-arrow-left"></i>
            Dashboard

        </button>

    </div>

</div>

<div class="container mt-5">

<h2 class="mb-4">
    <i class="fa-solid fa-chart-line"></i>
    Retailer Earnings
</h2>


<div class="row g-4">


<div class="col-md-4">
<div class="card p-4 shadow">
<h5>Total Revenue</h5>
<h2 id="totalRevenue">₹0</h2>
</div>
</div>


<div class="col-md-4">
<div class="card p-4 shadow">
<h5>Total Orders</h5>
<h2 id="totalOrders">0</h2>
</div>
</div>


<div class="col-md-4">
<div class="card p-4 shadow">
<h5>Average Order Value</h5>
<h2 id="averageOrder">₹0</h2>
</div>
</div>


<div class="col-md-4">
<div class="card p-4 shadow">
<h5>Confirmed Orders</h5>
<h2 id="confirmedOrders">0</h2>
</div>
</div>


<div class="col-md-4">
<div class="card p-4 shadow">
<h5>Pending Orders</h5>
<h2 id="pendingOrders">0</h2>
</div>
</div>


<div class="col-md-4">
<div class="card p-4 shadow">
<h5>Cancelled Orders</h5>
<h2 id="cancelledOrders">0</h2>
</div>
</div>


</div>

</div>
<div class="container mt-5">
<div class="card shadow p-4 chart-card">

    <h4 class="mb-4">
        Order Status Overview
    </h4>

    <div class="chart-container">

        <canvas id="orderChart"></canvas>

    </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/retailer-earning.js"></script>

</body>

</html>
