<div class="modal fade" id="orderModal">

class="btn btn-secondary"
data-bs-dismiss="modal">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
const urlParams = new URLSearchParams(window.location.search);
const productId = urlParams.get('id');
const productDetailEl = document.getElementById("productDetail");
const reviewListEl = document.getElementById("reviewList");
const submitReviewBtn = document.getElementById("submitReviewBtn");

// Show loading initially
productDetailEl.innerText = "Loading...";
reviewListEl.innerText = "Loading...";

// Fetch product details
fetch(`http://localhost:8080/api/products/${productId}`)
.then(res => {
  if (!res.ok) throw new Error("Product fetch failed");
  return res.json();
})
.then(product => {
  productDetailEl.innerHTML = `
    <h1>${product.name}</h1>
    <img src="${product.image}" width="300">
    <p><strong>Price:</strong> ₹${product.price}</p>
    <p><strong>Quantity:</strong> 
      <input type="number" id="buyQuantity" value="1" min="1" max="${product.quantity}" style="width:60px">
      kg (Available: ${product.quantity})
    </p>
    <p>${product.description || "No description available"}</p>
    <button id="addToCartBtn" class="btn btn-success btn-sm">Add to Cart</button>
    <button id="buyNowBtn" class="btn btn-warning btn-sm">Buy Now</button>
  `;

  document.getElementById("addToCartBtn").addEventListener("click", () => addToCart(product._id));
 document.getElementById("buyNowBtn").addEventListener("click", () => {
    buyNow(product._id);
});

  // Load reviews after product exists
  loadReviews(product._id);
})
.catch(err => {
  console.error(err);
  productDetailEl.innerText = "Product not found!";
  reviewListEl.innerText = "";
});

// Load reviews
function loadReviews(productId) {
  if (!reviewListEl) return;

  fetch(`http://localhost:8080/api/reviews/${productId}`)
  .then(res => res.json())
  .then(reviews => {
    if (!reviews || reviews.length === 0) {
      reviewListEl.innerText = "No reviews yet.";
    } else {
      reviewListEl.innerHTML = reviews.map(r => {
        const stars = "★".repeat(r.rating) + "☆".repeat(5 - r.rating);
        return `
          <div class="review-card border p-2 mb-2">
            <strong>${r.user ? r.user.name : "Anonymous"}</strong>
            <span class="review-stars">${stars}</span>
            <p>${r.comment}</p>
          </div>
        `;
      }).join("");
    }
  })
  .catch(err => {
    console.error(err);
    reviewListEl.innerText = "Failed to load reviews.";
  });
}

// Add to cart
function addToCart(productId) {
  const quantity = Number(document.getElementById("buyQuantity").value) || 1;
  const token = localStorage.getItem("token");

  fetch(`http://localhost:8080/cart/add/${productId}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`
    },
    body: JSON.stringify({ quantity })
  })
  .then(res => res.json())
  .then(data => {
   console.log("Cart response:", data);
   alert("Added to cart!");
})
.catch(err => console.error(err));
 // .then(res => res.json())
 // .then(() => alert("Added to cart!"))
 // .catch(err => console.error(err));
}
//wallet option
function showOrderModal(product){

    const quantity =
    Number(document.getElementById("buyQuantity").value) || 1;

    const total = product.price * quantity;

    document.getElementById("orderProductName").innerText =
    product.name;

    document.getElementById("orderQuantity").innerText =
    quantity;

    document.getElementById("orderTotal").innerText =
    total;

    document.getElementById("confirmOrderBtn").setAttribute(
        "data-product",
        product._id
    );

    new bootstrap.Modal(
        document.getElementById("orderModal")
    ).show();

}

// Buy now
let selectedProduct = null;

function buyNow(productId) {

    const quantity =
    Number(document.getElementById("buyQuantity").value) || 1;

    fetch(`http://localhost:8080/api/products/${productId}`)

    .then(res => res.json())

    .then(product => {

        selectedProduct = {
            productId,
            quantity,
            seller: product.seller._id || product.seller,
            name: product.name,
            total: product.price * quantity
        };

        document.getElementById("orderProductName").innerText =
        product.name;

        document.getElementById("orderQuantity").innerText =
        quantity;

        document.getElementById("orderTotal").innerText =
        product.price * quantity;

        loadRewardWallet(product.seller._id || product.seller);

        new bootstrap.Modal(
            document.getElementById("orderModal")
        ).show();

    });

}

function loadRewardWallet(sellerId){
  console.log("Seller ID:", sellerId);

    const token = localStorage.getItem("token");

    fetch(`http://localhost:8080/api/reward-wallet/${sellerId}`,{

        headers:{
            Authorization:"Bearer "+token
        }

    })

    .then(res=>{
       console.log("Status:", res.status);
        return res.json();
    })

    .then(wallet => {

    console.log("Wallet Response:", wallet);

    const discount = (wallet.points / 10) * 5;

    document.getElementById("rewardSection").innerHTML =

    wallet.points > 0 ?

    `

    <div class="alert alert-success">

        <h6 class="fw-bold mb-3">
            Reward Wallet
        </h6>

        <p class="mb-2">

            <strong>Available Coins :</strong>

            ${wallet.points}

        </p>

        <p class="mb-3">

            <strong>Discount Value :</strong>

            ₹${discount}

        </p>

        <div class="form-check">

            <input
                class="form-check-input"
                type="checkbox"
                id="useReward">

            <label class="form-check-label">

                Use Reward Wallet

            </label>

        </div>

    </div>

    `

    :

    `

    <div class="alert alert-secondary">

        No Reward Wallet available for this seller.

    </div>

    `;

});

}



// Submit review
if (submitReviewBtn) {
  submitReviewBtn.addEventListener("click", () => {
    const rating = Number(document.getElementById("reviewRating").value);
    const comment = document.getElementById("reviewComment").value;
    const token = localStorage.getItem("token");

    fetch(`http://localhost:8080/api/reviews/${productId}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ rating, comment })
    })
    .then(res => res.json())
    .then(data => {
      if (data.message === "Review added") {
        alert("Review added!");
        loadReviews(productId);
        document.getElementById("reviewRating").value = "";
        document.getElementById("reviewComment").value = "";
      } else {
        alert(data.message || "Failed to add review");
      }
    })
    .catch(err => console.error(err));
  });
}


</script>
<script>
const user = JSON.parse(localStorage.getItem("user"));

if (user) {
    const loginBtn = document.getElementById("loginNav");

    if (loginBtn) {
        loginBtn.style.display = "none";
    }
}

document.getElementById("confirmOrderBtn").addEventListener("click", async () => {

    const token = localStorage.getItem("token");

    const useReward =
        document.getElementById("useReward")?.checked || false;

    const res = await fetch("http://localhost:8080/api/orders", {

        method: "POST",

        headers: {

            "Content-Type": "application/json",
            Authorization: "Bearer " + token

        },

        body: JSON.stringify({

            product: selectedProduct.productId,
            quantity: selectedProduct.quantity,
            useReward

        })

    });

    const data = await res.json();

    if (res.ok) {

        alert("Order placed successfully!");

        window.location.href = "/orders.html";

    } else {

        alert(data.message);

    }

});
</script>
