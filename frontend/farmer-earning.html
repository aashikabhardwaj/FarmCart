<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Earnings | FarmCart</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/farmer-earning.css">

</head>

<body>
<!-- HEADER -->
<nav class="farmer-navbar">

    <div class="farmer-brand">
        FarmCart
    </div>

    <a href="farmer-dashboard.html" class="dashboard-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Dashboard
    </a>

</nav>

<div class="container py-4">

    <!-- Heading -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold"><i class="fa-solid fa-sack-dollar"></i> Earnings Dashboard</h2>
            <p class="text-muted mb-0">
                View your earnings and sales summary.
            </p>
        </div>

    </div>

    <!-- Summary Cards -->

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card shadow border-0 p-4 text-center">

                <i class="fa-solid fa-indian-rupee-sign fa-2x text-success mb-3"></i>

                <h5>Total Earnings</h5>

                <h3 id="totalEarnings">₹0</h3>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow border-0 p-4 text-center">

                <i class="fa-solid fa-cart-shopping fa-2x text-primary mb-3"></i>

                <h5>Total Orders</h5>

                <h3 id="totalOrders">0</h3>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow border-0 p-4 text-center">

                <i class="fa-solid fa-seedling fa-2x text-warning mb-3"></i>

                <h5>Products Sold</h5>

                <h3 id="productsSold">0</h3>

            </div>

        </div>

    </div>

    <!-- Recent Orders -->

    <div class="card shadow border-0 mt-5">

        <div class="card-header bg-success text-white">

            <h5 class="mb-0">
                Recent Orders
            </h5>

        </div>

        <div class="table-responsive">

            <table class="table table-hover mb-0">

                <thead>

                    <tr>

                        <th>Buyer</th>
                        <th>Products</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Date</th>

                    </tr>

                </thead>

                <tbody id="recentOrders">

                    <tr>

                        <td colspan="4" class="text-center py-4">

                            No Orders Found

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
        <p class="mb-1">
            &copy; 2025 FarmCart. All Rights Reserved.
        </p>

        <a href="#" class="text-info mx-2">
            Privacy Policy
        </a>
        |

        <a href="#" class="text-info mx-2">
            Terms & Conditions
        </a>
    </div>
</footer>

<script src="js/farmer-earning.js"></script>

</body>
</html>
