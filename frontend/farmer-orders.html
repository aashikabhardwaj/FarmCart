<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farmer Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">

</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-success px-3 d-flex justify-content-between align-items-center">

    <a class="navbar-brand fw-bold" href="farmer-dashboard.html">
        FarmCart
    </a>

    <a href="farmer-dashboard.html" class="btn btn-light">
        <i class="fa-solid fa-arrow-left me-2"></i>
        Dashboard
    </a>

</nav>

<div class="container mt-5">

<h2 class="mb-4 text-success">
Orders Received
</h2>

<div class="table-responsive">

<table class="table table-bordered table-hover bg-white">

<thead class="table-success">

<tr>
<th>Customer</th>
<th>Product</th>
<th>Quantity</th>
<th>Total Amount</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="ordersTableBody">

</tbody>

</table>

</div>

</div>
<!-- Packaging Modal -->

<div class="modal fade" id="packagingModal" tabindex="-1">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">
Select Packaging
</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<input
type="hidden"
id="packagingOrderId">

<label class="form-label">
Packaging Type
</label>

<select
id="packagingType"
class="form-select">

<option value="">Select Packaging</option>

<option value="Wooden Box">
Wooden Box
</option>

<option value="Cloth Bag">
Cloth Bag
</option>

<option value="Glass Bottle">
Glass Bottle
</option>

<option value="Plastic Crate">
Plastic Crate
</option>

<option value="Other">
Other
</option>

</select>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Cancel

</button>

<button
class="btn btn-success"
onclick="savePackaging()">

Save

</button>

</div>

</div>

</div>

</div>
<footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
        <p class="mb-1">
            &copy; 2025 FarmCart. All Rights Reserved.
        </p>

        <a href="#" class="text-info mx-2">
            Privacy Policy
        </a>
        |

        <a href="#" class="text-info mx-2">
            Terms & Conditions
        </a>
    </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/farmer-orders.js"></script>

</body>
</html>
