<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farmer Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">

<div class="farmer-dashboard">

<div class="container mt-5">

<!-- Header -->

<div class="card shadow-sm border-0 welcome-card mb-4">

<div class="card-body d-flex justify-content-between align-items-center">

<div>

<h2>
<i class="fa-solid fa-user"></i>
Farmer Profile
</h2>

<p class="mb-0">
Manage your FarmCart account
</p>

</div>

<a href="farmer-dashboard.html"
class="btn btn-light">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>

</div>

</div>


<!-- Profile Card -->

<div class="card profile-main-card shadow border-0">

<div class="card-body p-4">

<div class="text-center">

<div class="profile-avatar">
    <i class="fa-solid fa-user-tie"></i>
</div>

<h2 id="name" class="mt-3">

Loading...

</h2>

<p id="email" class="text-muted">

Loading...

</p>

<span
id="role"
class="badge bg-success fs-6">

Farmer

</span>

</div>


<hr class="my-4">


<div class="row text-center g-4">

<div class="col-md-6">

<div class="profile-stat-card">

<i class="fa-solid fa-seedling"></i>

<h3 id="totalProducts">

0

</h3>

<p>

Products

</p>

</div>

</div>


<div class="col-md-6">

<div class="profile-stat-card">

<i class="fa-solid fa-cart-shopping"></i>

<h3 id="totalOrders">

0

</h3>

<p>

Orders

</p>

</div>

</div>

</div>


<hr class="my-3">

<p class="text-center">
    <i class="fa-solid fa-user-tag"></i>
    Account Type:
    <span id="accountType"></span>
</p>


</div>


<div class="text-center mt-2">

<button

class="btn btn-danger px-5"

onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>

</div>

</div>

</div>

</div>

</div>

<script src="js/farmer-profile.js"></script>

</body>

</html>
