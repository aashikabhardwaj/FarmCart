<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>farmcart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <!--navbar-->
    <nav class="navbar navbar-expand-lg navbar-light bg-light, whole-nav">
  <a class="navbar-brand" href="#">Farmcart</a>
  <label>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button></label>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
      <li class="nav-item active">
        <a class="nav-link" href="index.html">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="farmers.html">Farmers</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="products.html">Eco-friendly</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="cart.html">Cart</a>
      </li>
      <li class="nav-item" id="loginNav">
        <a class="nav-link" href="login.html">Login</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="orders.html">Orders</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="profile.html">Profile</a>
      </li>
    </ul>
  </div>
</nav>
<!--title-->
<section class="products-banner text-center">
  <div class="overlay">
    <h1>Fresh Products from Local Farmers</h1>
    <p>Organic, eco-friendly, and directly from farms to your cart!</p>
    <a href="#productsGrid" class="btn-shop">Shop Now</a>
  </div>
</section>
<!--filter,category-->
<section class="products-filters container my-4">
  <div class="filter-bar d-flex align-items-center">
    <!-- Category Filter -->
     <label for="categoryFilter">Choose a category:</label>
<select id="categoryFilter" class="filter-select">
  <option value="">All Categories</option>
  <option value="Fruit">Fruits</option>
  <option value="Vegetable">Vegetables</option>
  <option value="Dairy">Dairy</option>
  <option value="Grain">Grains</option>
</select>


    <!-- Search Bar -->
    <input type="text" id="searchInput" class="search-input ms-3" placeholder="Search products...">
  </div>
</section>
<!--products clickable-->
<!--products-->
<section class="products-grid container my-5" id="productsGrid">
  <div class="row" id="gridContainer">
    <!-- Product cards will be injected here via JS -->
  </div>

</section>
<script src="js/farmers.js"></script>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-5">
  <div class="container">
    <p class="mb-1">&copy; 2025 FarmCart. All Rights Reserved.</p>
    <a href="#" class="text-info mx-2">Privacy Policy</a> |
    <a href="#" class="text-info mx-2">Terms & Conditions</a>
  </div>
</footer> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js">
</script>  <!-- keep path same as where products.js is -->

<script>
window.addEventListener("load", () => {
    const user = JSON.parse(localStorage.getItem("user"));
    if (user) {
        const loginNav = document.getElementById("loginNav");
        if (loginNav) {
            loginNav.style.display = "none";
        }
    }
});
</script>
</body>
</html>
