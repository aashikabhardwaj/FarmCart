<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Packaging Return Requests</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="css/retailer-packaging.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- Navbar -->

<div class="container mt-4">

    <a href="retailer-dashboard.html"
       class="btn btn-outline-success">

        <i class="fa-solid fa-arrow-left me-2"></i>

        Back to Dashboard

    </a>

</div>

<div class="container my-4">

<h2 class="page-title mb-4">
<i class="fa-solid fa-recycle me-2"></i>
Packaging Return Requests

</h2>



<!-- Summary Cards -->

<div class="row mb-4">

<div class="col-md-3">

<div class="stat-card">

<h3 id="pendingCount">0</h3>

<p>Pending Requests</p>

</div>

</div>

<div class="col-md-3">

<div class="stat-card">

<h3 id="approvedCount">0</h3>

<p>Approved Returns</p>

</div>

</div>

<div class="col-md-3">

<div class="stat-card">

<h3 id="rejectedCount">0</h3>

<p>Rejected Returns</p>

</div>

</div>

<div class="col-md-3">

<div class="stat-card">

<h3 id="ecoCount">0</h3>

<p>Eco Packages Saved</p>

</div>

</div>

</div>



<!-- Table -->

<div class="table-container">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>Customer</th>

<th>Order</th>

<th>Packaging</th>

<th>Condition</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="requestsTable">

<tr>

<td colspan="6"
class="text-center">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>



<!-- Review Modal -->

<div
class="modal fade"
id="reviewModal"
tabindex="-1">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">

Packaging Review

</h5>

<button
class="btn-close"
data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<input
type="hidden"
id="requestId">

<div class="row">

<div class="col-md-6">

<img
id="customerImage"
src="images/no-image.png"
class="img-fluid rounded border"
alt="Packaging Image">

</div>

<div class="col-md-6">

<p>

<strong>Customer :</strong>

<span id="customerName"></span>

</p>

<p>

<strong>Packaging :</strong>

<span id="packagingType"></span>

</p>

<p>

<strong>Condition :</strong>

<span id="packagingCondition"></span>

</p>

<p>

<strong>Comment :</strong>

</p>

<div
class="border rounded p-2"
id="customerComment">

-

</div>

</div>

</div>

<hr>

</div>

<div class="modal-footer">

<button
class="btn btn-danger"
onclick="rejectRequest()">

Reject

</button>

<button
class="btn btn-success"
onclick="approveRequest()">

Approve

</button>

</div>

</div>

</div>

</div>



<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">

</script>

<script
src="js/retailer-packaging.js">

</script>

</body>

</html>
