<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Eco Products</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/retailer-products.css">

</head>

<body>

<div class="container py-4">

    <div>

        <h2>
            <i class="fa-solid fa-leaf text-success"></i>

        </h2>

        <p class="text-muted">

        </p>

    </div>

    <div class="d-flex gap-2">

        <a href="retailer-dashboard.html" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <a href="add-ecoproducts.html" class="btn btn-success">
            <i class="fa-solid fa-plus"></i>
            Add Product
        </a>

    </div>

  </div>

    <!-- Search -->
    <div class="row mb-4">

        <div class="col-md-6">

            <input
                type="text"
                class="form-control"
                id="searchInput"
                placeholder="Search Product...">

        </div>

    </div>

    <!-- Products -->

    <div class="row" id="productsContainer">

    </div>

</div>

<script src="js/retailer-products.js"></script>
