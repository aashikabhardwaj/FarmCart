<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retailer Inventory</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/retailer-inventory.css">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success px-5 py-3">

    <a class="navbar-brand fw-bold fs-1" href="#">
        <i class="fa-solid fa-store me-2"></i>
        FarmCart
    </a>

    <div class="ms-auto">

        <button
            class="btn btn-light btn-lg"
            onclick="window.location.href='retailer-dashboard.html'">

            <i class="fa-solid fa-arrow-left"></i>
            Dashboard

        </button>

    </div>

</nav>
<div class="container mt-5">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-header bg-success text-white py-4">

            <h2 class="mb-0">
                <i class="fa-solid fa-warehouse me-2"></i>
                Inventory Management
            </h2>

        </div>

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead class="table-success">

                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Current Stock</th>
                        <th>Status</th>
                        <th>Update Stock</th>
                    </tr>

                </thead>

                <tbody id="inventoryTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="js/retailer-inventory.js"></script>

</body>
</html>
