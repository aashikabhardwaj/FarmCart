<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock Management | FarmCart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/farmer-stock.css">

</head>

<body>
    <nav class="navbar navbar-dark bg-success px-3 d-flex justify-content-between align-items-center">

    <a class="navbar-brand fw-bold" href="farmer-dashboard.html">
        FarmCart
    </a>

    <a href="farmer-dashboard.html" class="btn btn-light">
        <i class="fa-solid fa-arrow-left me-2"></i>
        Dashboard
    </a>

</nav>

<div class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h2 class="fw-bold">📦 Stock Management</h2>

<p class="text-muted">
Manage your product inventory
</p>

</div>

</div>

<div class="row g-4">

<div class="col-md-3">

<div class="card shadow p-3 text-center">

<h5>Total Products</h5>

<h2 id="totalProducts">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="card shadow p-3 text-center">

<h5>In Stock</h5>

<h2 id="inStock">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="card shadow p-3 text-center">

<h5>Low Stock</h5>

<h2 id="lowStock">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="card shadow p-3 text-center">

<h5>Out Of Stock</h5>

<h2 id="outOfStock">0</h2>

</div>

</div>

</div>

<div class="card shadow mt-5">

<div class="card-header bg-success text-white">

<h5 class="mb-0">
Product Stock
</h5>

</div>

<div class="table-responsive">

<table class="table table-hover mb-0">

<thead>

<tr>

<th>Product</th>
<th>Category</th>
<th>Quantity</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="stockTable">

<tr>

<td colspan="5" class="text-center py-4">

No Products Found

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3 mt-5">

        <p class="mb-1">

        <a href="#" class="text-info mx-2">
            Terms & Conditions
        </a>
    </div>
</footer>

<script src="js/farmer-stock.js"></script>

</body>
</html>
